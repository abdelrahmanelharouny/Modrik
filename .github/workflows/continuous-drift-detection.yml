name: Continuous Drift Detection

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Evidence revision lookback window (1–168 hours)"
        required: false
        default: "48"

permissions:
  contents: read

concurrency:
  group: modrik-continuous-drift-sweep
  cancel-in-progress: false

jobs:
  enqueue-consented-evidence-revisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRIFT_SWEEP_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
      DRIFT_SWEEP_MAX_REVISIONS: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Enqueue continuous drift checks
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not configured; drift sweep was not run."
            exit 0
          fi
          bun scripts/run-continuous-drift-sweep.ts
