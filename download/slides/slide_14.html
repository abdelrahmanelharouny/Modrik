<!DOCTYPE html>

<head>

<div class="slide" style="background:linear-gradient(135deg,#093A45,#0E4F5C);color:#FFFFFF;">

  <!-- Decorative ghost numeral -->
  <div data-decor aria-hidden="true" class="fn" style="position:absolute;right:-24px;bottom:-96px;font-size:360px;font-weight:800;line-height:1;color:rgba(255,255,255,0.05);user-select:none;">04</div>

  <div class="relative h-full flex flex-col" style="padding:64px;">

      <span class="chip-ghost fn">12 actions</span>
