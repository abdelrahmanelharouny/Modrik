<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section 01 — Verdict at a Glance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>body{margin:0;}</style>
</head>
<body>
<div class="slide" style="background:linear-gradient(135deg,#093A45 0%,#0E4F5C 100%);color:#FFFFFF;">

  <!-- Decor -->
  <div data-decor aria-hidden="true" style="position:absolute;right:-170px;bottom:-250px;width:580px;height:580px;border:1px solid rgba(255,255,255,0.12);border-radius:50%;"></div>
  <div data-decor aria-hidden="true" style="position:absolute;right:70px;bottom:-240px;width:300px;height:300px;border:1px solid rgba(255,255,255,0.08);border-radius:50%;"></div>
  <div data-decor aria-hidden="true" style="position:absolute;left:-140px;top:-160px;width:520px;height:520px;background:radial-gradient(circle,rgba(255,255,255,0.07) 0%,rgba(255,255,255,0) 68%);"></div>

  <!-- Chapter marker -->
  <div style="position:absolute;top:64px;right:64px;padding-right:150px;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:800;font-size:92px;line-height:1;letter-spacing:0.02em;color:rgba(255,255,255,0.5);">01 / 04</div>

  <!-- Title block -->
  <div style="position:absolute;left:72px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:900px;padding-bottom:56px;">
    <div class="rule-accent"></div>
    <h1 style="font-family:var(--font-heading);font-size:var(--fs-display);font-weight:700;color:#FFFFFF;margin:26px 0 0;line-height:1.1;">Verdict at a Glance</h1>
    <p style="font-size:20px;line-height:1.6;color:rgba(255,255,255,0.88);margin:22px 0 0;max-width:880px;">“An exceptionally well-prepared graduation project — honest about the literature, precise about its mechanisms, disciplined about evaluation.”</p>
  </div>

  <!-- Chips -->
  <div style="position:absolute;left:72px;bottom:60px;display:flex;gap:14px;">
    <span style="border:1.2px solid rgba(255,255,255,0.5);border-radius:999px;padding:9px 20px;font-size:13.5px;font-weight:600;color:#FFFFFF;letter-spacing:0.02em;">6 dimensions scored</span>
    <span style="border:1.2px solid rgba(255,255,255,0.5);border-radius:999px;padding:9px 20px;font-size:13.5px;font-weight:600;color:#FFFFFF;letter-spacing:0.02em;">4 conditions attached</span>
    <span style="border:1.2px solid rgba(255,255,255,0.5);border-radius:999px;padding:9px 20px;font-size:13.5px;font-weight:600;color:#FFFFFF;letter-spacing:0.02em;">No structural flaws found</span>
  </div>

</div>
</body>
</html>
